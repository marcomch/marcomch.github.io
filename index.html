<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Tabla XZ</title>
<style>
/* Layout: una columna — tabla del "8" arriba, recorrido y tramos debajo (estética del analizador) */
:root{--bg:#1a1a2e;--bg2:#16213e;--panel:rgba(255,255,255,.05);--line:#34495e;--fg:#ffffff;--muted:#95a5a6;
--blue:#3498db;--red:#e74c3c;--acc:#f1c40f;--ok:#27ae60;--warn:#f39c12;color-scheme:dark}
*{box-sizing:border-box}
body{background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--fg);font-family:'Segoe UI',Tahoma,sans-serif;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.3rem;margin:0;letter-spacing:.5px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--fg);border:0;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--blue)}
.btn{background:rgba(52,152,219,.2);color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.btn.red{background:rgba(231,76,60,.2);color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.status{margin-left:auto;font-family:'Courier New',monospace;font-weight:bold;color:var(--acc)}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
svg text{font-family:'Courier New',monospace}
.cell{cursor:pointer}
.cell:hover circle{stroke-width:3}
.done .cell{cursor:default}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.chip{font-family:'Courier New',monospace;font-weight:bold;font-size:1.05rem;padding:3px 8px;border-radius:6px}
.chip.A{background:rgba(52,152,219,.2);color:var(--blue);border:1px solid var(--blue)}
.chip.R{background:rgba(231,76,60,.2);color:var(--red);border:1px solid var(--red)}
.chip.last{box-shadow:0 0 0 2px var(--acc)}
.empty{color:var(--muted);font-size:.9rem}
.arr{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.7rem;letter-spacing:1px;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--ok);font-weight:600}.down{color:var(--red);font-weight:600}.flat{color:var(--muted);font-weight:600}
.mis{font-size:.65rem;font-weight:bold;color:var(--warn);background:rgba(243,156,18,.15);padding:2px 6px;border-radius:4px}
small{color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.sum b{display:block;font-size:1.3rem;font-family:'Courier New',monospace}
.sum span{font-size:.7rem;color:var(--muted);letter-spacing:.5px}
.note{font-size:.8rem;color:var(--muted);margin:0}
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <h1>SIMULADOR TABLA XZ</h1>
    <p class="sub">Elige cuántos dígitos tendrá el recorrido y toca las casillas en orden. Azul = el tick subió, rojo = el tick bajó.</p>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="Cantidad de dígitos" id="seg">
        <button data-n="4">4</button><button data-n="5" aria-pressed="true">5</button><button data-n="6">6</button>
      </div>
      <button class="btn" id="undo">Deshacer</button>
      <button class="btn red" id="reset">Reiniciar</button>
      <span class="status" id="status"></span>
    </div>
    <svg id="tbl" viewBox="0 0 300 500" role="img" aria-label="Tabla XZ"></svg>
  </div>

  <div class="panel">
    <span class="empty" style="letter-spacing:1px;font-size:.75rem">RECORRIDO</span>
    <div class="seq" id="seq"></div>
    <div class="scroll"><table id="tramos"></table></div>
    <div class="sum" id="sum"></div>
    <p class="note">El precio de cada tramo sale del color del dígito de llegada: si llega a azul el precio subió, si llega a rojo bajó.</p>
  </div>
</div>

<script>
const BLUE='#3498db',RED='#e74c3c',ACC='#f1c40f',MUTED='#95a5a6';
const H=(d,c)=>c==='A'?5-Math.abs(d-5):Math.abs(d-5)-6;
const REG=(d,c)=>d===0||d===5?'extremo':c==='A'?(d<5?'R1':'R2'):(d<5?'R3':'R4');
function pos(d,c){const h=H(d,c);const row=c==='A'?5-h:6+(-1-h);const y=34+row*36+(c==='R'?18:0);
  let x=150;if(d!==0&&d!==5)x=c==='A'?(d<5?220:80):(d<5?80:220);return{x,y}}
let N=5,pts=[];
const svg=document.getElementById('tbl');
function draw(){
  const full=pts.length>=N;svg.classList.toggle('done',full);
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${ACC}"/></marker></defs>`;
  s+=`<ellipse cx="150" cy="124" rx="122" ry="108" fill="rgba(52,152,219,.10)" stroke="${BLUE}" stroke-opacity=".4"/>`;
  s+=`<ellipse cx="150" cy="376" rx="122" ry="108" fill="rgba(231,76,60,.10)" stroke="${RED}" stroke-opacity=".4"/>`;
  s+=`<text x="8" y="16" font-size="11" fill="${BLUE}">ZONA AZUL</text><text x="8" y="494" font-size="11" fill="${RED}">ZONA ROJA</text>`;
  s+=`<text x="80" y="244" font-size="10" text-anchor="middle" fill="${MUTED}">R2</text><text x="220" y="244" font-size="10" text-anchor="middle" fill="${MUTED}">R1</text>`;
  s+=`<text x="80" y="262" font-size="10" text-anchor="middle" fill="${MUTED}">R3</text><text x="220" y="262" font-size="10" text-anchor="middle" fill="${MUTED}">R4</text>`;
  const last=pts[pts.length-1];
  for(const c of['A','R'])for(let d=0;d<10;d++){const p=pos(d,c),col=c==='A'?BLUE:RED;
    const idx=pts.map((q,i)=>q.d===d&&q.c===c?i+1:0).filter(Boolean);const on=idx.length>0,isLast=last&&last.d===d&&last.c===c;
    s+=`<g class="cell" data-d="${d}" data-c="${c}" tabindex="0" role="button" aria-label="${d}${c}"><circle cx="${p.x}" cy="${p.y}" r="15" fill="${on?col:'rgba(0,0,0,.25)'}" stroke="${isLast?ACC:col}" stroke-width="${isLast?3:1.5}"/><text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="15" font-weight="bold" fill="${on?'#fff':col}">${d}</text></g>`;
    s+=`<text x="${p.x<150?p.x-24:p.x+24}" y="${p.y+4}" text-anchor="middle" font-size="9" fill="${MUTED}">${H(d,c)}</text>`;
    if(on)s+=`<text x="${p.x+(p.x>150?-20:20)}" y="${p.y-14}" text-anchor="middle" font-size="10" font-weight="bold" fill="${ACC}">${idx.join(',')}</text>`;}
  for(let i=1;i<pts.length;i++){const a=pos(pts[i-1].d,pts[i-1].c),b=pos(pts[i].d,pts[i].c);const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);if(L<1)continue;
    const k=18/L,nw=i===pts.length-1;s+=`<line x1="${a.x+dx*k}" y1="${a.y+dy*k}" x2="${b.x-dx*k}" y2="${b.y-dy*k}" stroke="${ACC}" stroke-width="${nw?3:1.6}" stroke-opacity="${.35+.65*i/(pts.length-1)}" marker-end="url(#ah)" pointer-events="none"/>`}
  svg.innerHTML=s;
  document.getElementById('status').textContent=full?`Completo ${pts.length}/${N}`:`${pts.length}/${N}`;
  document.getElementById('undo').disabled=!pts.length;
  document.getElementById('seq').innerHTML=pts.length?pts.map((p,i)=>`${i?'<span class="arr">→</span>':''}<span class="chip ${p.c} ${i===pts.length-1?'last':''}">${p.d}${p.c}</span>`).join(''):'<span class="empty">Toca la primera casilla en la tabla.</span>';
  const dir=v=>v>0?'<span class="up">sube</span>':v<0?'<span class="down">baja</span>':'<span class="flat">igual</span>';
  let t='<tr><th>TRAMO</th><th>TABLA</th><th>PRECIO</th><th>REGIÓN</th><th></th></tr>',ok=0,bad=0,up=0;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dt=H(b.d,b.c)-H(a.d,a.c);const dp=b.c==='A'?1:-1;
    const par=a.c===b.c&&a.d!==b.d&&a.d+b.d===10;const mis=Math.sign(dt)!==dp;mis?bad++:ok++;if(dt>0)up++;
    t+=`<tr><td>${a.d}${a.c} → ${b.d}${b.c}</td><td>${dir(dt)} <small>${H(a.d,a.c)}→${H(b.d,b.c)}${par?' · paralelos':''}</small></td><td>${dir(dp)}</td><td><small>${REG(a.d,a.c)}→${REG(b.d,b.c)}</small></td><td>${mis?'<span class="mis">NO COINCIDE</span>':''}</td></tr>`}
  document.getElementById('tramos').innerHTML=pts.length>1?t:'';
  document.getElementById('sum').innerHTML=pts.length>1?`<div><b>${ok}</b><span>COINCIDEN</span></div><div><b style="color:var(--warn)">${bad}</b><span>NO COINCIDEN</span></div><div><b>${pts.length?H(pts[0].d,pts[0].c):''} → ${H(last.d,last.c)}</b><span>ALTURA INICIO → FIN</span></div>`:'';
}
function add(g){if(!g||pts.length>=N)return;pts.push({d:+g.dataset.d,c:g.dataset.c});draw()}
svg.addEventListener('click',e=>add(e.target.closest('.cell')));
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();add(e.target.closest('.cell'))}});
document.getElementById('undo').onclick=()=>{pts.pop();draw()};
document.getElementById('reset').onclick=()=>{pts=[];draw()};
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;N=+b.dataset.n;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));pts=pts.slice(0,N);draw()});
// ejemplo inicial (página 4 del PDF) para mostrar cómo funciona
pts=[{d:3,c:'R'},{d:5,c:'A'},{d:6,c:'A'},{d:8,c:'R'},{d:4,c:'A'}];
draw();
</script>
</body>
</html>
