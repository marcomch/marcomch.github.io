    // ====================== VARIABLES GLOBALES ======================

    // ====================== NUEVAS VARIABLES PARA SISTEMA DE ALERTAS ======================

    // ====================== ELEMENTOS DEL DOM ======================

    // ====================== NUEVOS ELEMENTOS PARA DETECCIÓN DE NIVEL ======================
    const priceLevelIndicator = document.getElementById("price-level-indicator");
    const greenDigitCountBadge = document.getElementById("green-digit-count-badge");
    
    // ====================== ELEMENTOS PARA MONITOREO MEJORADO ======================
    const tradeMonitorEl = document.getElementById("trade-monitor");
    const monitorStatusEl = document.getElementById("monitor-status");
    const monitorChartEl = document.getElementById("monitor-chart");
    const ticksRemainingEl = document.getElementById("ticks-remaining");
    const chartPointsInfo = document.getElementById("chart-points-info");
    
    // Elementos de información del monitor
    const infoEntryPriceEl = document.getElementById("info-entry-price");

    // ====================== NUEVOS ELEMENTOS PARA CONFIGURACIÓN ======================
    const soundAlertSwitch = document.getElementById("sound-alert-switch");
    const soundIndicator = document.getElementById("sound-indicator");
    const pushAlertSwitch = document.getElementById("push-alert-switch");
    const pushIndicator = document.getElementById("push-indicator");
    
    // ====================== VARIABLES CANVASJS ======================
    let digitsChart = null;     // Gráfico de dígitos
    let priceChart = null;      // Gráfico de precios
    // Tamaño de ventana configurable desde la página (20 / 35 / 60)
    const WINDOW_OPTIONS = [20, 35, 60];
    const WINDOW_DEFAULT = 20;
    let MAX_CHART_POINTS = (function () {
        try {
            const saved = parseInt(localStorage.getItem('analizador_window_size'), 10);
            if (WINDOW_OPTIONS.includes(saved)) return saved;
        } catch (e) { /* localStorage no disponible */ }
        return WINDOW_DEFAULT;
    })();
    let digitsDataPoints = [];
    let priceDataPoints = [];
    let maxLineDataPoints = [];   // puntos de la línea punteada azul (máximos)
    let minLineDataPoints = [];   // puntos de la línea punteada roja (mínimos)
    let currentPosition = 1;
    let priceChartPosition = 1;

    // ====================== ZIGZAG (lógica del indicador de IQ Option) ======================
    // Pivote por reversión porcentual: sigue el extremo (máximo si la dirección es
    // arriba, mínimo si es abajo) y, cuando el precio se aleja del extremo más que
    // reference * pct / 100, confirma el pivote y cambia de dirección.
    const ZZ_UP_COLOR = "#FF7700";    // tramos ascendentes
    const ZZ_DOWN_COLOR = "#57A1D0";  // tramos descendentes
    let zigzagEnabled = true;
    let zigzagPct = 0.01;             // porcentaje de reversión (%)
    let zigzagDataPoints = [];
    let priceTickSeq = 0;             // contador monotónico de ticks (identifica pivotes aunque la ventana se desplace)

    function computeZigZag(points, pct) {
        if (!points.length) return [];
        let dirUp = true;
        let reference = points[0].y;
        let hVal = points[0].y, hIdx = 0;
        let lVal = points[0].y, lIdx = 0;
        const pivots = [];

        for (let i = 0; i < points.length; i++) {
            const y = points[i].y;
            const reverseRange = reference * pct / 100;

            if (dirUp) {
                if (y >= hVal) { hVal = y; hIdx = i; }
                if (y < hVal - reverseRange) {
                    pivots.push({ i: hIdx, y: hVal, type: 'high' });
                    dirUp = false;
                    reference = hVal;
                    lVal = y; lIdx = i;
                }
            } else {
                if (y <= lVal) { lVal = y; lIdx = i; }
                if (y > lVal + reverseRange) {
                    pivots.push({ i: lIdx, y: lVal, type: 'low' });
                    dirUp = true;
                    reference = lVal;
                    hVal = y; hIdx = i;
                }
            }
        }

        // Tramo provisional: del último pivote al extremo que se está formando
        const pending = dirUp
            ? { i: hIdx, y: hVal, type: 'high', pending: true }
            : { i: lIdx, y: lVal, type: 'low', pending: true };
        if (!pivots.length || pivots[pivots.length - 1].i !== pending.i) pivots.push(pending);

        // Punto de arranque (primer precio de la ventana)
        const nodes = [];
        if (pivots[0].i !== 0) nodes.push({ i: 0, y: points[0].y, type: 'start' });
        pivots.forEach(p => nodes.push(p));

        return nodes.map((n, k) => {
            const prev = k > 0 ? nodes[k - 1] : null;
            const goingUp = prev ? n.y >= prev.y : true;
            const color = goingUp ? ZZ_UP_COLOR : ZZ_DOWN_COLOR;
            const pt = {
                x: points[n.i].x,
                y: n.y,
                tick: points[n.i].tick,
                lineColor: color,          // colorea el tramo que llega a este punto
                lineThickness: 2
            };
            if (n.type !== 'start' && !n.pending) {
                pt.markerType = "circle";
                pt.markerSize = 7;
                pt.markerColor = n.type === 'high' ? ZZ_UP_COLOR : ZZ_DOWN_COLOR;
                pt.markerBorderColor = "#fff";
                pt.markerBorderThickness = 1;
            } else {
                pt.markerType = "none";
            }
            return pt;
        });
    }

    // Sincroniza todas las series del gráfico de precios (precio, ZigZag, líneas max/min)
    function syncPriceSeries() {
        if (!priceChart) return;
        rebuildLevelLines();
        const zz = zigzagEnabled ? computeZigZag(priceDataPoints, zigzagPct) : [];
        zigzagDataPoints.length = 0;
        zz.forEach(p => zigzagDataPoints.push(p));

        priceChart.options.data[0].dataPoints = priceDataPoints;
        // Con ZigZag activo se ocultan las líneas punteadas max/min para no saturar
        priceChart.options.data[1].dataPoints = zigzagEnabled ? [] : maxLineDataPoints;
        priceChart.options.data[2].dataPoints = zigzagEnabled ? [] : minLineDataPoints;
        priceChart.options.data[3].dataPoints = zigzagDataPoints;
        priceChart.render();
        publishZigZagState();
    }

    // ---- Señal del ZigZag para el bot ----
    // window.zigzagState se actualiza en cada tick:
    //   { enabled, pct, direction: 'UP'|'DOWN'|null, pivots:[{x,y,type}], pending:{x,y}|null }
    // Cuando se confirma un pivote nuevo se dispara el evento 'zigzag-pivot':
    //   window.addEventListener('zigzag-pivot', e => console.log(e.detail));
    //   e.detail = { type:'high'|'low', price, direction:'UP'|'DOWN' (dirección que empieza) }
    let lastPivotTick = null;
    function publishZigZagState() {
        const pts = zigzagDataPoints;
        const pivots = pts.filter(p => p.markerType === 'circle')
            .map(p => ({ x: p.x, y: p.y, tick: p.tick, type: p.markerColor === ZZ_UP_COLOR ? 'high' : 'low' }));
        const last = pts.length ? pts[pts.length - 1] : null;
        const pending = last && last.markerType !== 'circle' ? { x: last.x, y: last.y } : null;
        // Si el extremo provisional es un máximo, la dirección vigente es UP
        const direction = last ? (last.lineColor === ZZ_UP_COLOR ? 'UP' : 'DOWN') : null;

        window.zigzagState = { enabled: zigzagEnabled, pct: zigzagPct, direction, pivots, pending };

        if (!pivots.length) { lastPivotTick = null; return; }
        const lp = pivots[pivots.length - 1];
        // Sólo se emite cuando aparece un pivote MÁS RECIENTE que el último emitido;
        // los pivotes que salen de la ventana o reajustes del inicio no disparan nada.
        if (lastPivotTick !== null && lp.tick > lastPivotTick) {
            window.dispatchEvent(new CustomEvent('zigzag-pivot', {
                detail: {
                    type: lp.type,
                    price: lp.y,
                    tick: lp.tick,
                    direction: lp.type === 'high' ? 'DOWN' : 'UP'
                }
            }));
        }
        if (lastPivotTick === null || lp.tick > lastPivotTick) lastPivotTick = lp.tick;
    }
    
    /* ==================================================================
       CAPA API DERIV — NUEVA VERSIÓN (v4)
       ------------------------------------------------------------------
       Cambios cubiertos respecto a la API legacy:
       · Endpoint público de market data sin autenticación:
           wss://api.derivws.com/trading/v1/options/ws/public
         (con fallback automático a wss://ws.derivws.com/websockets/v3)
       · symbol  ->  underlying_symbol  (active_symbols, proposal,
         portfolio, transaction, proposal_open_contract)
       · active_symbols devuelve underlying_symbol / underlying_symbol_name
         / underlying_symbol_type y pip_size en formato decimal (0.0001)
       · tick.pip_size pasó de REQUERIDO a OPCIONAL -> ya no se puede
         confiar en él; se resuelve vía active_symbols / ticks_history
       · tick.quote y tick.epoch ahora sí son requeridos
       · ticks admite subscribe:0 (snapshot) y arreglo de símbolos
       · history.prices / history.times ahora son requeridos
       · echo_req ya NO está garantizado en las respuestas
       · buy: se compra contra un proposal ID (flujo proposal -> buy)
       · proposal: sólo `id` está garantizado; ask_price/payout pueden
         llegar como number O string
       ================================================================== */
    const DERIV_CONFIG = {
        app_id: 1089,
        // Endpoint nuevo (market data público, sin token)
        publicEndpoint: "wss://api.derivws.com/trading/v1/options/ws/public",
        // Endpoint legacy: sigue siendo el canal para trading con token
        legacyEndpoint: "wss://ws.derivws.com/websockets/v3?app_id=1089",
        useNewEndpoint: true
    };

    // Metadatos de símbolos resueltos desde active_symbols
    let symbolMeta = {};          // { underlying_symbol: {pipSize, decimals, name, type} }
    let currentDecimals = 3;      // decimales vigentes del activo actual
    let tickSubscriptionId = null;

    // Fallback si active_symbols aún no respondió
    const DECIMALES_FALLBACK = {
        'R_100': 2, 'R_10': 3, 'R_25': 3, 'R_50': 4, 'R_75': 4,
        'RDBEAR': 4, 'RDBULL': 4,
        '1HZ10V': 2, '1HZ25V': 2, '1HZ50V': 2, '1HZ75V': 2, '1HZ100V': 2,
        'frxEURUSD': 5, 'frxEURJPY': 3
    };

    /* pip_size llega en dos formatos según el endpoint:
         · active_symbols  -> 0.0001  (decimal)
         · ticks_history   -> 5       (cantidad de decimales)
       Esta función normaliza ambos a "cantidad de decimales". */
    function normalizarPipSize(pip) {
        if (pip === null || pip === undefined) return null;
        const v = parseFloat(pip);
        if (!isFinite(v) || v <= 0) return null;
        if (v < 1) return Math.round(-Math.log10(v));   // 0.0001 -> 4
        return Math.round(v);                            // 5 -> 5
    }

    function obtenerDecimalesPorInstrumento(assetValue) {
        if (symbolMeta[assetValue] && symbolMeta[assetValue].decimals != null) {
            return symbolMeta[assetValue].decimals;
        }
        return DECIMALES_FALLBACK[assetValue] !== undefined
            ? DECIMALES_FALLBACK[assetValue]
            : 2;
    }

    function aplicarDecimales(assetValue, decimals, origen) {
        if (decimals == null) return;
        if (!symbolMeta[assetValue]) symbolMeta[assetValue] = {};
        symbolMeta[assetValue].decimals = decimals;
        if (assetValue === currentAsset) {
            currentDecimals = decimals;
            const el = document.getElementById('dm-pipsize');
            if (el) el.textContent = `${decimals} dec (${origen})`;
        }

    /* ==================================================================
       MOTOR DE ESTADÍSTICAS DE DÍGITOS
       Alimentado por ticks_history (siembra inicial) + ticks en vivo
       ================================================================== */
    let digitSample = [];            // buffer de dígitos crudos
    let digitSampleSize = 500;

    function resetDigitStats() {
        digitSample = [];
        renderDigitStats();
    }

    function pushDigitSample(d) {
        if (d === null || d === undefined || isNaN(d)) return;
        digitSample.push(d);
        while (digitSample.length > digitSampleSize) digitSample.shift();
    }

    function calcularEstadisticasDigitos() {
        const n = digitSample.length;
        const counts = new Array(10).fill(0);
        digitSample.forEach(d => { if (d >= 0 && d <= 9) counts[d]++; });

        const pct = counts.map(c => n ? (c / n) * 100 : 0);
        const barrier = parseInt(document.getElementById('digit-barrier')?.value ?? 4);

        let even = 0, odd = 0, over = 0, under = 0;
        digitSample.forEach(d => {
            (d % 2 === 0) ? even++ : odd++;
            if (d > barrier) over++;
            else if (d < barrier) under++;   // igual a la barrera no cuenta (regla Deriv)
        });

        // Dígito más / menos frecuente
        let hot = 0, cold = 0;
        for (let i = 1; i < 10; i++) {
            if (counts[i] > counts[hot]) hot = i;
            if (counts[i] < counts[cold]) cold = i;
        }

        // Racha actual (repeticiones del último dígito al final del buffer)
        let streak = 0, last = digitSample[n - 1];
        for (let i = n - 1; i >= 0 && digitSample[i] === last; i--) streak++;

        return {
            n, counts, pct, barrier, hot, cold, last, streak,
            evenPct: n ? (even / n) * 100 : 0,
            oddPct:  n ? (odd  / n) * 100 : 0,
            overPct: n ? (over / n) * 100 : 0,
            underPct:n ? (under/ n) * 100 : 0
        };
    }

    function renderDigitStats() {
        const s = calcularEstadisticasDigitos();
        const cont = document.getElementById('digit-dist');
        if (!cont) return;

        const maxPct = Math.max(...s.pct, 1);
        let html = '';
        for (let d = 0; d < 10; d++) {
            const altura = (s.pct[d] / maxPct) * 100;
            let cls = 'ddist-bar';
            if (d === s.hot && s.n > 0)  cls += ' ddist-hot';
            if (d === s.cold && s.n > 0) cls += ' ddist-cold';
            if (d === s.last)            cls += ' ddist-last';
            html += `
                <div class="ddist-col">
                    <div class="ddist-pct">${s.pct[d].toFixed(1)}%</div>
                    <div class="ddist-track">
                        <div class="${cls}" style="height:${altura}%"></div>
                    </div>
                    <div class="ddist-digit">${d}</div>
                </div>`;
        }
        cont.innerHTML = html;

        const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
        set('digit-sample-count', s.n);
        set('dm-even',  s.evenPct.toFixed(1) + '%');
        set('dm-odd',   s.oddPct.toFixed(1) + '%');
        set('dm-over',  s.overPct.toFixed(1) + '%');
        set('dm-under', s.underPct.toFixed(1) + '%');
        set('dm-hot',   s.n ? `${s.hot} (${s.pct[s.hot].toFixed(1)}%)` : '-');
        set('dm-cold',  s.n ? `${s.cold} (${s.pct[s.cold].toFixed(1)}%)` : '-');
        set('dm-streak',s.n ? `${s.last} ×${s.streak}` : '-');
    }

    function solicitarTicksHistory(socket, symbol, count) {

    function procesarTicksHistory(data) {
        // v4: history.prices y history.times son requeridos cuando history existe
        const hist = data.history;
        if (!hist || !Array.isArray(hist.prices)) return;

        // pip_size viene a nivel raíz en la respuesta de history
        const dec = normalizarPipSize(data.pip_size);
        if (dec != null) aplicarDecimales(currentAsset, dec, 'ticks_history');

        const decimals = obtenerDecimalesPorInstrumento(currentAsset);
        digitSample = [];
        hist.prices.forEach(p => {
            const d = digitoDesdePrecio(p, decimals);
            if (d !== null) digitSample.push(d);
        });
        while (digitSample.length > digitSampleSize) digitSample.shift();

        renderDigitStats();
        console.log(`🌱 Histograma sembrado con ${digitSample.length} dígitos históricos`);
    }

    // Extracción de dígito unificada (último decimal según pip_size)
    function digitoDesdePrecio(price, decimals) {
        const v = parseFloat(price);
        if (!isFinite(v)) return null;
        const s = v.toFixed(decimals);
        const d = parseInt(s.charAt(s.length - 1));
        return isNaN(d) ? null : d;
    }

    // ====================== SISTEMA DE GRÁFICO DE MONITOREO MEJORADO ======================
    
    function drawMonitorChart() {
        if (!monitorCtx || !monitorCanvas || priceHistoryData.length === 0) return;
        
        const width = monitorCanvas.width;
        const height = monitorCanvas.height;
        const padding = 20;
        const chartWidth = width - (padding * 2);
        const chartHeight = height - (padding * 2);
        
        // Limpiar canvas
        monitorCtx.clearRect(0, 0, width, height);
        
        // Dibujar fondo
        drawChartBackground(width, height, padding);
        
        // Calcular rangos de precios
        const prices = priceHistoryData.map(p => p.price);
        const entryPrice = activeTrade.entryPrice;
        const currentPrice = activeTrade.currentPrice;
        
        const minPrice = Math.min(...prices, entryPrice, currentPrice);
        const maxPrice = Math.max(...prices, entryPrice, currentPrice);
        const priceRange = Math.max(0.0001, maxPrice - minPrice);
        
        // Dibujar áreas de ganancia/pérdida
        drawProfitLossAreas(width, height, padding, chartHeight, minPrice, priceRange);
        
        // Dibujar líneas de referencia
        drawReferenceLines(width, height, padding, chartHeight, minPrice, priceRange);
        
        // Dibujar línea del precio (SOLO con puntos significativos)
        drawPriceLine(width, height, padding, chartWidth, chartHeight, minPrice, priceRange);
        
        // Dibujar punto de entrada
        drawEntryPoint(width, height, padding, chartWidth, chartHeight, entryPrice, minPrice, priceRange);
        
        // Dibujar punto actual
        drawCurrentPoint(width, height, padding, chartWidth, chartHeight, currentPrice, minPrice, priceRange);
        
        // Dibujar leyenda
        drawChartLegend(width, height);
        
        // Actualizar contador de puntos
        if (chartPointsInfo) {
            chartPointsInfo.textContent = `Puntos: ${priceHistoryData.length}`;
        }
    }
    
    function drawChartBackground(width, height, padding) {
        // Fondo del gráfico
        monitorCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        monitorCtx.fillRect(padding, padding, width - (padding * 2), height - (padding * 2));
        
        // Borde del gráfico
        monitorCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        monitorCtx.lineWidth = 1;
        monitorCtx.strokeRect(padding, padding, width - (padding * 2), height - (padding * 2));
        
        // Líneas de la grilla
        monitorCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        monitorCtx.lineWidth = 0.5;
        
        // Líneas horizontales
        const horizontalLines = 5;
        for (let i = 0; i <= horizontalLines; i++) {
            const y = padding + (i * (height - (padding * 2)) / horizontalLines);
            monitorCtx.beginPath();
            monitorCtx.moveTo(padding, y);
            monitorCtx.lineTo(width - padding, y);
            monitorCtx.stroke();
        }
        
        // Líneas verticales (marcas de tiempo)
        const verticalLines = Math.min(10, priceHistoryData.length);
        for (let i = 0; i < verticalLines; i++) {
            const x = padding + (i * (width - (padding * 2)) / verticalLines);
            monitorCtx.beginPath();
            monitorCtx.moveTo(x, padding);
            monitorCtx.lineTo(x, height - padding);
            monitorCtx.stroke();
        }
    }
    
    function drawProfitLossAreas(width, height, padding, chartHeight, minPrice, priceRange) {
        if (!activeTrade) return;
        
        const entryPrice = activeTrade.entryPrice;
        const entryY = padding + chartHeight - ((entryPrice - minPrice) / priceRange * chartHeight);
        
        // Área de ganancia (verde claro)
        monitorCtx.fillStyle = 'rgba(46, 204, 113, 0.05)';
        monitorCtx.fillRect(padding, padding, width - (padding * 2), entryY - padding);
        
        // Área de pérdida (rojo claro)
        monitorCtx.fillStyle = 'rgba(231, 76, 60, 0.05)';
        monitorCtx.fillRect(padding, entryY, width - (padding * 2), height - padding - entryY);
    }
    
    function drawReferenceLines(width, height, padding, chartHeight, minPrice, priceRange) {
        // Línea de entrada
        const entryPrice = activeTrade.entryPrice;
        const entryY = padding + chartHeight - ((entryPrice - minPrice) / priceRange * chartHeight);
        
        monitorCtx.strokeStyle = 'rgba(52, 152, 219, 0.5)';
        monitorCtx.lineWidth = 2;
        monitorCtx.setLineDash([5, 3]);
        
        monitorCtx.beginPath();
        monitorCtx.moveTo(padding, entryY);
        monitorCtx.lineTo(width - padding, entryY);
        monitorCtx.stroke();
        
        // Restaurar línea sólida
        monitorCtx.setLineDash([]);
        
        // Etiqueta de línea de entrada
        monitorCtx.fillStyle = 'rgba(52, 152, 219, 0.8)';
        monitorCtx.font = '10px Arial';
        monitorCtx.fillText('Entrada', width - padding - 50, entryY - 5);
    }
    
    function drawPriceLine(width, height, padding, chartWidth, chartHeight, minPrice, priceRange) {
        if (priceHistoryData.length < 2) return;
        
        // Configurar estilo de línea
        monitorCtx.strokeStyle = activeTrade.isWinning ? 'rgba(46, 204, 113, 0.8)' : 'rgba(231, 76, 60, 0.8)';
        monitorCtx.lineWidth = 2;
        monitorCtx.lineJoin = 'round';
        monitorCtx.lineCap = 'round';
        
        // Filtrar puntos para suavizar la línea (eliminar puntos muy cercanos)
        const filteredPoints = priceHistoryData; // Usamos todos los puntos (ya están filtrados)
        
        // Dibujar línea de precio
        monitorCtx.beginPath();
        
        filteredPoints.forEach((point, index) => {
            const x = padding + (index * chartWidth / (filteredPoints.length - 1));
            const y = padding + chartHeight - ((point.price - minPrice) / priceRange * chartHeight);
            
            if (index === 0) {
                monitorCtx.moveTo(x, y);
            } else {
                monitorCtx.lineTo(x, y);
            }
        });
        
        monitorCtx.stroke();
        
        // Dibujar puntos SOLO en cambios significativos
        filteredPoints.forEach((point, index) => {
            // Solo dibujar puntos en el primero, último y cambios importantes
            if (index === 0 || index === filteredPoints.length - 1 || 
                isSignificantChange(filteredPoints, index)) {
                
                const x = padding + (index * chartWidth / (filteredPoints.length - 1));
                const y = padding + chartHeight - ((point.price - minPrice) / priceRange * chartHeight);
                
                monitorCtx.fillStyle = activeTrade.isWinning ? 'rgba(46, 204, 113, 1)' : 'rgba(231, 76, 60, 1)';
                monitorCtx.beginPath();
                monitorCtx.arc(x, y, 3, 0, Math.PI * 2);
                monitorCtx.fill();
                
                // Borde blanco en los puntos
                monitorCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                monitorCtx.lineWidth = 1;
                monitorCtx.beginPath();
                monitorCtx.arc(x, y, 3, 0, Math.PI * 2);
                monitorCtx.stroke();
            }
        });
    }
    
    function drawEntryPoint(width, height, padding, chartWidth, chartHeight, entryPrice, minPrice, priceRange) {
        const x = padding;

    // FUNCIÓN PARA DETECTAR CAMBIOS SIGNIFICATIVOS
    function isSignificantChange(points, index) {
        if (index === 0 || index === points.length - 1) return true;
        
        const prevPrice = points[index-1].price;
        const currPrice = points[index].price;
        const nextPrice = points[index+1].price;
        
        // Cambio significativo si hay una reversión o cambio grande
        const prevChange = Math.abs(currPrice - prevPrice);
        const nextChange = Math.abs(nextPrice - currPrice);
        
        // Umbral basado en el instrumento
        const assetValue = document.getElementById("asset-selector").value;
        const xd = obtenerDecimalesPorInstrumento(assetValue);
        const threshold = xd >= 4 ? 0.0005 : 0.005; // Umbral diferente para forex vs índices
        
        return prevChange > threshold || nextChange > threshold;
    }
    
    // ====================== SISTEMA DE AUDIO PARA ALERTAS SONORAS ======================
    
    function initializeAudioSystem() {
        try {
            // Crear contexto de audio
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            gainNode.gain.value = 0.5; // Volumen al 50%
            console.log("🔊 Sistema de audio inicializado");
        } catch (e) {
            console.warn("⚠️ No se pudo inicializar el sistema de audio:", e.message);
            soundAlertsEnabled = false;
            updateSoundSwitch();
        }
    }
    
    function playAlertSound(type) {
        if (!soundAlertsEnabled || !audioContext) return;
        
        try {
            const oscillator = audioContext.createOscillator();
            const envelope = audioContext.createGain();
            
            oscillator.connect(envelope);
            envelope.connect(gainNode);
            
            // Configurar frecuencia según tipo de alerta
            switch(type) {
                case 'win':
                    oscillator.frequency.value = 880; // LA5
                    break;
                case 'loss':
                    oscillator.frequency.value = 440; // LA4
                    break;
                case 'warning':
                    oscillator.frequency.value = 660; // MI5
                    break;
                default:
                    oscillator.frequency.value = 523.25; // DO5
            }
            
            oscillator.type = 'sine';
            
            // Configurar envolvente ADSR
            envelope.gain.setValueAtTime(0, audioContext.currentTime);
            envelope.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
            envelope.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
            
        } catch (e) {
            console.warn("⚠️ Error reproduciendo sonido:", e.message);
        }
    }
    
    function testSound(type) {

    // ====================== SISTEMA DE NOTIFICACIONES PUSH ======================
    
    function requestNotificationPermission() {
        if (!('Notification' in window)) {
            console.log("⚠️ Este navegador no soporta notificaciones push");
            pushAlertsEnabled = false;
            updatePushSwitch();
            return;
        }
        
        if (Notification.permission === 'granted') {
            console.log("✅ Permiso para notificaciones ya concedido");
            return;
        }
        
        if (Notification.permission !== 'denied') {
            // Mostrar solicitud de permiso después de un delay
            setTimeout(() => {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        console.log("✅ Permiso para notificaciones concedido");
                    } else {
                        console.log("❌ Permiso para notificaciones denegado");
                        pushAlertsEnabled = false;
                        updatePushSwitch();
                        saveAlertSettings();
                    }
                });
            }, 3000);
        }
    }
    
    function showNotification(title, message, type = 'info') {
        // 1. Notificación del navegador
        if (pushAlertsEnabled && Notification.permission === 'granted') {
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⚠️';
            const notification = new Notification(`Trading Manual - ${title}`, {
                body: `${icon} ${message}`,
                icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
                tag: 'trading-alert'
            });
            
            notification.onclick = function() {
                window.focus();
                this.close();
            };
            
            // Cerrar automáticamente después de 5 segundos
            setTimeout(() => notification.close(), 5000);
        }
        
        // 2. Notificación interna en la aplicación
        showInternalNotification(title, message, type);
    }
    
    function showInternalNotification(title, message, type = 'info') {
        const notificationContainer = document.getElementById('notification-container');
        if (!notificationContainer) return;
        
        const notificationId = 'notification-' + Date.now();
        const iconClass = type === 'success' ? 'fa-check-circle' : 
                         type === 'error' ? 'fa-times-circle' : 
                         type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle';
        
        const notificationHTML = `
            <div class="notification ${type} show" id="${notificationId}">
                <div class="notification-icon">
                    <i class="fas ${iconClass}"></i>
                </div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
                <button class="notification-close" onclick="closeNotification('${notificationId}')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;
        
        notificationContainer.insertAdjacentHTML('afterbegin', notificationHTML);
        
        // Auto-cerrar después de 5 segundos
        setTimeout(() => {
            closeNotification(notificationId);
        }, 5000);
        
        // Limitar a 5 notificaciones simultáneas
        const notifications = notificationContainer.querySelectorAll('.notification');
        if (notifications.length > 5) {
            notifications[notifications.length - 1].remove();
        }
    }
    
    function closeNotification(id) {
        const notification = document.getElementById(id);
        if (notification) {
            notification.classList.remove('show');
            notification.classList.add('hide');
            setTimeout(() => notification.remove(), 300);
        }
    }

    function toggleSoundAlerts() {
        soundAlertsEnabled = !soundAlertsEnabled;
        updateSoundSwitch();
        saveAlertSettings();
        
        const message = soundAlertsEnabled 
            ? 'Alertas sonoras activadas' 
            : 'Alertas sonoras desactivadas';
        showInternalNotification('Configuración', message, soundAlertsEnabled ? 'success' : 'warning');
    }
    
    function togglePushAlerts() {
        if (!('Notification' in window)) {
            showInternalNotification('Error', 'Este navegador no soporta notificaciones push', 'error');
            return;
        }
        
        if (Notification.permission === 'denied') {
            showInternalNotification('Error', 'Permiso para notificaciones denegado. Por favor, habilítalo manualmente en la configuración del navegador.', 'error');
            return;
        }
        
        if (Notification.permission !== 'granted') {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    pushAlertsEnabled = true;
                    updatePushSwitch();
                    saveAlertSettings();
                    showInternalNotification('Configuración', 'Notificaciones push activadas', 'success');
                }
            });
        } else {
            pushAlertsEnabled = !pushAlertsEnabled;
            updatePushSwitch();
            saveAlertSettings();
            
            const message = pushAlertsEnabled 
                ? 'Notificaciones push activadas' 
                : 'Notificaciones push desactivadas';
            showInternalNotification('Configuración', message, pushAlertsEnabled ? 'success' : 'warning');
        }
    }

        if (!soundIndicator || !soundAlertSwitch) return;
        if (soundAlertsEnabled) {
            soundIndicator.classList.add('active');
            soundAlertSwitch.classList.add('active');

            soundIndicator.classList.remove('active');
            soundAlertSwitch.classList.remove('active');

    function updatePushSwitch() {
        if (!pushIndicator || !pushAlertSwitch) return;
        if (pushAlertsEnabled && Notification.permission === 'granted') {
            pushIndicator.classList.add('active');
            pushAlertSwitch.classList.add('active');

            soundAlerts: soundAlertsEnabled,
            pushAlerts: pushAlertsEnabled

            localStorage.setItem('alertSettings', JSON.stringify(settings));

                soundAlertsEnabled = settings.soundAlerts !== undefined ? settings.soundAlerts : true;

    function initializeLevelHistory() {

    // FUNCIÓN PRINCIPAL: Determina si el precio actual es máximo, mínimo o medio
   function updatePriceLevel(currentPrice) {
        const numericPrice = parseFloat(currentPrice);
        
        // Agregar precio al historial
        priceHistory.push(numericPrice);
        
        // Mantener solo los últimos PRICE_HISTORY_LENGTH precios
        if (priceHistory.length > PRICE_HISTORY_LENGTH) {
            priceHistory.shift();
        }
        
        // Si no hay suficientes datos, retornar 'mid'
        if (priceHistory.length < 3) {
            currentPriceLevel = 'mid';
            return currentPriceLevel;
        }
        
        // Encontrar máximo y mínimo en el historial
        maxPrice = Math.max(...priceHistory);
        minPrice = Math.min(...priceHistory);
        
        // Determinar nivel actual
        if (numericPrice === maxPrice && numericPrice !== minPrice) {
            currentPriceLevel = 'max';
        } else if (numericPrice === minPrice && numericPrice !== maxPrice) {
            currentPriceLevel = 'min';
        } else {
            currentPriceLevel = 'mid';
            
            // Contar dígito verde (cuando el precio está en nivel medio)
            greenDigitsCount++;
        }
        
        // Actualizar historial de niveles
        levelHistory.push(currentPriceLevel);
        if (levelHistory.length > 20) {
            levelHistory.shift();
        }
        
        // Actualizar display
        updateLevelDisplay();
        
        return currentPriceLevel;
    }
    
    function updateLevelDisplay() {
        if (!priceLevelIndicator) return;
        
        // Actualizar indicador de nivel
        switch(currentPriceLevel) {
            case 'max':
                priceLevelIndicator.textContent = 'MÁXIMO';
                priceLevelIndicator.className = 'price-level-indicator level-max';
                break;
            case 'min':
                priceLevelIndicator.textContent = 'MÍNIMO';
                priceLevelIndicator.className = 'price-level-indicator level-min';
                break;
            case 'mid':
                priceLevelIndicator.textContent = 'MEDIO';
                priceLevelIndicator.className = 'price-level-indicator level-mid';
                break;
        }
        
        // Actualizar color del dígito actual según nivel
        if (currentDigitEl) {
            currentDigitEl.classList.remove('digit-green');
            
            if (currentPriceLevel === 'mid') {
                // Añadir clase especial para dígito verde (nivel medio)
                currentDigitEl.classList.add('digit-green');
            }
        }
        
        // Actualizar contador de dígitos verdes
        if (greenDigitCountBadge) {
            greenDigitCountBadge.textContent = greenDigitsCount;
        }
    }
    
    function updateDigitBadgesWithLevel(digit, level) {
        // Esta función actualiza los badges de dígitos con indicadores de nivel
        const badges = digitsContainer.querySelectorAll('.digit-badge');
        const lastBadge = badges[0]; // El último dígito agregado es el primero en la lista
        
        if (lastBadge) {
            // Remover clases anteriores
            lastBadge.classList.remove('max-digit', 'min-digit', 'mid-digit');
            
            // Añadir clase según nivel
            switch(level) {
                case 'max':
                    lastBadge.classList.add('max-digit');
                    lastMaxDigit = digit; // Guardar último dígito máximo
                    break;
                case 'min':
                    lastBadge.classList.add('min-digit');
                    lastMinDigit = digit; // Guardar último dígito mínimo
                    break;
                case 'mid':
                    lastBadge.classList.add('mid-digit');
                    break;
            }
        }
    }

    function updateCanvasJSChart(digit, wentUp, processedDigit = null) {
        if (!digitsChart) return;
        
        const displayDigit = processedDigit !== null ? processedDigit : digit;
        const yValue = wentUp ? parseFloat(displayDigit) : -parseFloat(displayDigit);
        
        let markerColor = "black";
        let mSize = 3;
        let mType = "circle";
        
        const allYValues = [...digitsDataPoints.map(p => p.y), yValue];
        const maxY = Math.max(...allYValues);
        const minY = Math.min(...allYValues);
        
        if (yValue === maxY) {
            markerColor = "#29abe2";
            mSize = 5;
        } else if (yValue === minY) {
            markerColor = "#c03";
            mSize = 5;
        } else if (digitsDataPoints.length === 0) {
            markerColor = "#32cd32";
            mSize = 6;
        } else {
            markerColor = "black";
            mSize = 3;
        }
        
        const indexLabelFontColor = wentUp ? "#29abe2" : "#c03";
        
        const newPoint = {
            x: currentPosition,
            y: yValue,
            indexLabel: displayDigit.toString(),
            indexLabelFontWeight: "bold",
            indexLabelFontSize: labelFontSize(),
            indexLabelFontColor: indexLabelFontColor,
            markerBorderColor: "#ccc",
            markerSize: mSize,
            markerType: mType,
            markerColor: markerColor,
            markerBorderColor: "#ccc"
        };
        
        digitsDataPoints.push(newPoint);
        currentPosition++;
        
        if (digitsDataPoints.length > MAX_CHART_POINTS) {
            while (digitsDataPoints.length > MAX_CHART_POINTS) digitsDataPoints.shift();
            digitsDataPoints.forEach((point, index) => {
                point.x = index + 1;
            });
            currentPosition = digitsDataPoints.length + 1;
        }
        
        digitsChart.options.data[0].dataPoints = digitsDataPoints;
        digitsChart.render();
    }

    function updatePriceChart(price, digit, wentUp) {
        if (!priceChart) return;
        
        const assetValue = document.getElementById("asset-selector").value;
        const xd = obtenerDecimalesPorInstrumento(assetValue);
        const formattedPrice = parseFloat(price).toFixed(xd);
        const numericPrice = parseFloat(formattedPrice);

        priceDataPoints.push({
            x: priceChartPosition,

            indexLabel: digit.toString(),

            indexLabelFontColor: wentUp ? "#29abe2" : "#c03",

                       : currentPriceLevel === 'min' ? "#c03" : "black",
            level: currentPriceLevel,  // 'max' | 'min' | 'mid'
            tick: ++priceTickSeq
        });
        
        priceChartPosition++;
        
        if (priceDataPoints.length > MAX_CHART_POINTS) {
            while (priceDataPoints.length > MAX_CHART_POINTS) priceDataPoints.shift();
            priceDataPoints.forEach((point, index) => {
                point.x = index + 1;
            });
            priceChartPosition = priceDataPoints.length + 1;
        }
        
        // Ajustar rango Y dinámicamente
        if (priceDataPoints.length > 1) {
            const prices = priceDataPoints.map(p => p.y);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const range = maxPrice - minPrice;
            
            priceChart.options.axisY.minimum = minPrice - (range * 0.1);
            priceChart.options.axisY.maximum = maxPrice + (range * 0.1);
        }
        
        syncPriceSeries();
    }

        try { localStorage.setItem('analizador_window_size', String(n)); } catch (e) {}

        digitsDataPoints.forEach(pt => { pt.indexLabelFontSize = labelFontSize(); });
        priceDataPoints.forEach(pt => { pt.indexLabelFontSize = labelFontSize(); });

        // Recortar buffers conservando los más recientes
        while (digitsDataPoints.length > n) digitsDataPoints.shift();
        digitsDataPoints.forEach((pt, i) => { pt.x = i + 1; });
        currentPosition = digitsDataPoints.length + 1;

        while (priceDataPoints.length > n) priceDataPoints.shift();
        priceDataPoints.forEach((pt, i) => { pt.x = i + 1; });

        while (digitHistory.length > n) digitHistory.shift();
        while (digits.length > n) digits.shift();

            digitsChart.render();

    function updateTradeMonitor(price) {
        if (!activeTrade) return;
        
        const assetValue = document.getElementById("asset-selector").value;
        const xd = obtenerDecimalesPorInstrumento(assetValue);
        const currentPrice = parseFloat(price).toFixed(xd);
        
        activeTrade.currentPrice = parseFloat(currentPrice);
        
        // Agregar al historial de precios para el gráfico
        priceHistoryData.push({
            price: activeTrade.currentPrice,
            timestamp: Date.now()
        });
        
        // Mantener solo los últimos puntos
        if (priceHistoryData.length > MAX_MONITOR_POINTS) {
            priceHistoryData.shift();
        }
        
        const difference = activeTrade.currentPrice - activeTrade.entryPrice;
        const percentageChange = (difference / activeTrade.entryPrice) * 100;
        
        let isWinning = false;
        if (activeTrade.type === 'CALL') {
            isWinning = difference > 0;
        } else if (activeTrade.type === 'PUT') {
            isWinning = difference < 0;
        }
        
        activeTrade.isWinning = isWinning;
        activeTrade.profitLoss = difference;
        
        // Actualizar estado visual
        updateMonitorStatus(isWinning);
        
        // Actualizar información en el panel
        updateMonitorInfoPanel(activeTrade.entryPrice, activeTrade.currentPrice, difference, percentageChange);
        
        // Actualizar ticks restantes
        if (activeTrade.ticksRemaining > 0) {
            activeTrade.ticksRemaining--;
            if (ticksRemainingEl) {
                ticksRemainingEl.textContent = `${activeTrade.ticksRemaining} ticks`;
                
                // Cambiar color según ticks restantes
                if (activeTrade.ticksRemaining <= 2) {
                    ticksRemainingEl.style.color = 'var(--danger-color)';
                } else if (activeTrade.ticksRemaining <= 3) {
                    ticksRemainingEl.style.color = 'var(--warning-color)';
                }
            }
        }
        
        // Redibujar gráfico
        drawMonitorChart();
    }
    
    function updateMonitorInfoPanel(entryPrice, currentPrice, difference, percentage) {
        const xd = obtenerDecimalesPorInstrumento(currentAsset);
        
        // Actualizar valores
        infoEntryPriceEl.textContent = entryPrice.toFixed(xd);
        infoCurrentPriceEl.textContent = currentPrice.toFixed(xd);

    // FUNCIÓN MODIFICADA: Ahora incluye nivel de precio
   function updateDigitsContainer(digit, wentUp, level) {

    // ====================== FUNCIONES DE PROCESAMIENTO DE PRECIOS ======================
    // obtenerDecimalesPorInstrumento() ahora vive en la capa API v4:
    // resuelve los decimales desde pip_size (active_symbols / ticks_history)
    // en lugar del switch fijo, porque tick.pip_size ya no es garantizado.

    function esInstrumentoForex(assetValue) {
        const meta = symbolMeta[assetValue];
        if (meta && meta.type) return meta.type === 'forex';
        return assetValue.indexOf('frx') === 0;
    }

    function extractDigitAfterDecimal(price) {
        const assetValue = document.getElementById("asset-selector").value;
        const xd = obtenerDecimalesPorInstrumento(assetValue);
        const d = digitoDesdePrecio(price, xd);
        return d === null ? 0 : d;
    }
    
    function procesarDigitoConLogica010(digitActual, digitAnterior, wentUp) {
        let tic2nd = digitActual;
        
        if (digitActual !== 0) {
            tic2nd = wentUp ? parseFloat(digitActual) : -parseFloat(digitActual);
        } else {
            if (digitAnterior > 5 && digitActual === 0) {
                tic2nd = wentUp ? 10 : -10;
            } else if (digitAnterior <= 5 && digitActual === 0) {
                tic2nd = wentUp ? 0 : -0;
            }
        }
        
        return tic2nd;
    }
    
    function determineTrend(currentPrice, lastPrice) {
        if (lastPrice === null) return true;
        
        const assetValue = document.getElementById("asset-selector").value;
        const xd = obtenerDecimalesPorInstrumento(assetValue);
        
        const current = parseFloat(currentPrice).toFixed(xd);
        const last = parseFloat(lastPrice).toFixed(xd);
        
        return parseFloat(current) >= parseFloat(last);
    }
    
    // FUNCIÓN PRINCIPAL MODIFICADA: Ahora detecta nivel de precio
    function updateDigit(price, wentUp) {
        requestAnimationFrame(() => {
            const assetValue = document.getElementById("asset-selector").value;
            const xd = obtenerDecimalesPorInstrumento(assetValue);
            
            const formattedPrice = parseFloat(price).toFixed(xd);
            const digit = extractDigitAfterDecimal(price);
            
            // DETECTAR NIVEL DE PRECIO (MÁXIMO/MÍNIMO/MEDIO)
            const level = updatePriceLevel(formattedPrice);
            
            const digitAnterior = digitHistory.length > 0 ? digitHistory[digitHistory.length - 1] : null;
            const processedDigitValue = procesarDigitoConLogica010(digit, digitAnterior, wentUp);
            
            // Agregar a historial
            digitHistory.push(digit);
            while (digitHistory.length > MAX_CHART_POINTS) {
                digitHistory.shift();
            }
            
            // Actualizar elementos de la interfaz
            if (currentDigitEl) {
                currentDigitEl.textContent = digit;
                currentDigitEl.className = wentUp ? 'current-digit up' : 'current-digit down';
                
                // Añadir clase especial si es dígito verde (nivel medio)
                if (level === 'mid') {
                    currentDigitEl.classList.add('digit-green');
                }
            }
            
            if (priceEl) {
                priceEl.textContent = formattedPrice;
            }
            
            // Actualizar monitor si hay operación activa
            if (activeTrade && isTrading) {
                updateMonitorFromPrice(formattedPrice);
            }
            
            // Actualizar gráficos
            updateCanvasJSChart(digit, wentUp, Math.abs(processedDigitValue));
            updatePriceChart(price, digit, wentUp);
            
            // Actualizar contenedor de dígitos CON NIVEL
            updateDigitsContainer(digit, wentUp, level);
            
            // Actualizar badges con nivel
            updateDigitBadgesWithLevel(digit, level);
            
            // Actualizar contadores
            tickCount++;
            ticksCounter++;
            addTickToHistory(formattedPrice, digit, wentUp ? 'UP' : 'DOWN');
            
            lastPrice = price;
        });
    }
    
    // ====================== CONEXIÓN WEBSOCKET ======================
    function startFeed() {
        if (running) return;
        
        currentAsset = document.getElementById("asset-selector").value;
        
        const xd = obtenerDecimalesPorInstrumento(currentAsset);
        const esForex = esInstrumentoForex(currentAsset);
        console.log(`🎯 Instrumento: ${currentAsset}, Decimales: ${xd}, Forex: ${esForex}`);
        
        updateConnectionStatus("Conectando...", "#f39c12");
        
        // ws.binaryws.com está descontinuado. Se usa el endpoint público
        // nuevo con fallback automático al v3 si no está disponible.
        const endpoint = DERIV_CONFIG.useNewEndpoint
            ? DERIV_CONFIG.publicEndpoint
            : DERIV_CONFIG.legacyEndpoint;

        console.log(`🌐 Endpoint: ${endpoint}`);
        ws = new WebSocket(endpoint);
        tickSubscriptionId = null;
        manualStop = false;

        ws.onopen = () => {
            // 1) Metadatos de símbolos -> pip_size real
            solicitarActiveSymbols(ws);
            // 2) Siembra del histograma con histórico real
            solicitarTicksHistory(ws, currentAsset, digitSampleSize);
            // 3) Stream en vivo
            ws.send(JSON.stringify({
                ticks: currentAsset,
                subscribe: 1
            }));
            running = true;
            feedFallbackUsed = false;
            updateConnectionStatus("Conectado", "#27ae60");
            console.log(`✅ Conectado a ${currentAsset}`);
        };

        ws.onmessage = msg => {
            let data;
            try { data = JSON.parse(msg.data); } catch (e) { return; }

            // En v4 echo_req ya no está garantizado: se enruta por msg_type
            const tipo = data.msg_type;

            if (data.error) {
                console.error("❌ Error market data:", data.error.code, data.error.message);
                updateConnectionStatus(`Error: ${data.error.code}`, "#e74c3c");
                return;
            }

            if (tipo === 'active_symbols' || data.active_symbols) {
                procesarActiveSymbols(data.active_symbols);
                return;
            }

            if (tipo === 'history' || data.history) {
                procesarTicksHistory(data);
                return;
            }

            if (tipo === 'tick' && data.tick) {
                // Guardar el id de suscripción para poder hacer forget
                if (data.subscription && data.subscription.id) {
                    tickSubscriptionId = data.subscription.id;
                }

                // v4: quote y epoch son requeridos; pip_size es OPCIONAL
                const t = data.tick;
                if (t.pip_size !== undefined) {
                    const dec = normalizarPipSize(t.pip_size);
                    if (dec != null && dec !== obtenerDecimalesPorInstrumento(currentAsset)) {
                        aplicarDecimales(currentAsset, dec, 'tick');
                    }
                }

                if (t.quote === undefined || t.quote === null) return;

                const decimals = obtenerDecimalesPorInstrumento(currentAsset);
                const price = parseFloat(t.quote);
                const wentUp = determineTrend(price, lastPrice);

                // Alimentar el motor de estadísticas
                const d = digitoDesdePrecio(price, decimals);
                if (d !== null) {
                    pushDigitSample(d);
                    renderDigitStats();
                }

                updateDigit(price, wentUp);
            }
        };

        ws.onclose = () => {
            running = false;
            updateConnectionStatus("Desconectado", "#e74c3c");
            console.log("🔌 Conexión cerrada");

            if (manualStop) return;

            // Si el endpoint nuevo falla antes de recibir datos, caer al v3
            if (DERIV_CONFIG.useNewEndpoint && !feedFallbackUsed && digitSample.length === 0) {
                feedFallbackUsed = true;
                DERIV_CONFIG.useNewEndpoint = false;
                console.warn("⚠️ Endpoint nuevo no disponible → usando v3 legacy");
                setTimeout(startFeed, 1000);
                return;
            }

            setTimeout(() => {
                if (!running && !manualStop) {
                    console.log("🔄 Intentando reconectar...");
                    startFeed();
                }
            }, 5000);
        };

        ws.onerror = () => {
            updateConnectionStatus("Error de conexión", "#e74c3c");
        };
    }

    function stopFeed() {
        manualStop = true;
        if (ws && ws.readyState === WebSocket.OPEN) {
            // v4 mantiene forget/forget_all para cancelar streams por id
            if (tickSubscriptionId) {
                ws.send(JSON.stringify({ forget: tickSubscriptionId }));
            } else {
                ws.send(JSON.stringify({ forget_all: "ticks" }));
            }
            ws.close();
        } else if (ws) {
            ws.close();
        }
        tickSubscriptionId = null;
        running = false;
        updateConnectionStatus("Desconectado", "#e74c3c");
        console.log("⏹️ Feed detenido manualmente");
    }

    // ====================== SISTEMA DERIV AUTOTRADING CORREGIDO ======================
    /* El token NO debe ir escrito en el código fuente: cualquiera que abra
       el HTML lo ve. Se lee de localStorage y, si no existe, se pide una vez.
       IMPORTANTE: revoca el token anterior en app.deriv.com > API token. */
    function getDerivToken() {
        let t = localStorage.getItem('deriv_api_token');
        if (!t) {
            t = prompt("Ingresa tu API token de Deriv (se guarda sólo en este navegador):");
            if (t) localStorage.setItem('deriv_api_token', t.trim());

    const DURATION = 5;
    let pendingProposal = null;
    let pocSubscriptionId = null;
    
    window.operarAutomatico = function(signal, stake) {
        console.log(`🔄 Iniciando operación manual para ${signal}...`);
        
        if (!derivWs || derivWs.readyState !== WebSocket.OPEN) {
            console.log("⚠️ API no lista - Intentando reconectar...");
            conectarDerivAPI();
            setTimeout(() => window.operarAutomatico(signal, stake), 3000);
            return;
        }

        const contract_type = signal === "UP" ? "CALL" : "PUT";
        const symbol_actual = document.getElementById("asset-selector").value || "R_10";

        /* En la API nueva la compra se hace contra un proposal ID.
           Paso 1: pedir el proposal usando `underlying_symbol`
           Paso 2: al llegar el proposal, enviar { buy: <id>, price: <max> } */
        pendingProposal = {
            stake: stake,
            contract_type: contract_type,
            symbol: symbol_actual,
            timestamp: Date.now()
        };

        const proposalRequest = {
            proposal: 1,
            amount: stake,
            basis: "stake",
            contract_type: contract_type,
            currency: "USD",
            duration: DURATION,
            duration_unit: "t",
            underlying_symbol: symbol_actual   // ← renombrado desde `symbol` en v4
            // barrier_range, product_type, date_start, trade_risk_profile
            // y trading_period_start fueron eliminados en v4
        };

        derivWs.send(JSON.stringify(proposalRequest));
        console.log(`📤 PROPOSAL SOLICITADO: ${contract_type} | Stake: $${stake.toFixed(2)} | ${symbol_actual} | ${DURATION}t`);

        // Configurar timeout para operaciones colgadas
        setupTradeTimeout();
    };

    // Paso 2 del flujo de compra v4
    function ejecutarCompraDesdeProposal(proposal) {
        if (!pendingProposal) return;

        // En v4 sólo `id` está garantizado; ask_price/payout pueden ser
        // number O string, así que se normalizan y se validan.
        const id = proposal.id;
        if (!id) {
            console.error("❌ Proposal sin id, no se puede comprar");
            pendingProposal = null;
            resetTradingState();
            return;
        }

        const askPrice = proposal.ask_price !== undefined
            ? parseFloat(proposal.ask_price)
            : pendingProposal.stake;

        const maxPrice = isFinite(askPrice) ? askPrice : pendingProposal.stake;

        derivWs.send(JSON.stringify({
            buy: id,
            price: maxPrice        // precio máximo aceptado
        }));

        const payout = proposal.payout !== undefined ? parseFloat(proposal.payout) : null;
        console.log(`🛒 COMPRA ENVIADA | proposal: ${id} | precio máx: $${maxPrice.toFixed(2)}` +
                    (payout && isFinite(payout) ? ` | payout: $${payout.toFixed(2)}` : ''));
    }

    function validarResultadoContrato(contract_id, stake_inicial) {
        console.log(`🔍 Monitoreando contrato: ${contract_id}`);
        
        const subscribeRequest = {
            proposal_open_contract: 1,
            contract_id: contract_id,
            subscribe: 1
        };
        
        derivWs.send(JSON.stringify(subscribeRequest));
    }

    function conectarDerivAPI() {
        derivWs = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=1089`);
        window.derivWs = derivWs;

        derivWs.onopen = () => {
            console.log("🔄 Conectando a Deriv API...");
            const token = getDerivToken();
            if (!token) {
                console.error("❌ Sin token: no se puede autorizar");
                updateConnectionStatus("Sin token", "#e74c3c");
                return;
            }
            derivWs.send(JSON.stringify({ authorize: token }));
        };

        derivWs.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            if (data.authorize) {
                console.log("✅ AUTORIZADO EN DERIV:", data.authorize.loginid);
                // v4: balance ya no soporta multi-cuenta (account: "all")
                derivWs.send(JSON.stringify({ balance: 1, subscribe: 1 }));
            }

            // Respuesta del proposal → dispara la compra (flujo v4)
            if (data.proposal && pendingProposal) {
                ejecutarCompraDesdeProposal(data.proposal);
            }

            if (data.buy && data.buy.contract_id) {
                const contract_id = data.buy.contract_id;
                // v4: buy_price puede venir como number o string
                let stake = parseFloat(data.buy.buy_price);
                if (!isFinite(stake) && pendingProposal) stake = pendingProposal.stake;
                pendingProposal = null;

                currentContract = {
                    contract_id: contract_id,
                    stake: stake,
                    timestamp: Date.now(),
                    status: 'open'
                };
                
                console.log(`🎉 COMPRA EXITOSA! ID: ${contract_id} | Stake: $${stake.toFixed(2)} USD`);
                
                balance -= stake;
                updateTradingDisplay();
                
                setTimeout(() => validarResultadoContrato(contract_id, stake), 2000);
            }

            if (data.proposal_open_contract) {
                const contract = data.proposal_open_contract;

                // v4: guardar el id de suscripción para poder hacer forget
                if (data.subscription && data.subscription.id) {
                    pocSubscriptionId = data.subscription.id;
                }

                if (contract.is_sold) {
                    // v4: los campos numéricos pueden llegar como string
                    const profit = parseFloat(contract.profit);
                    const status = contract.status;
                    const contract_id = contract.contract_id;
                    
                    console.log(`🎯 CONTRATO FINALIZADO - ID: ${contract_id} | Status: ${status} | Ganancia: $${profit.toFixed(2)}`);
                    
                    // Procesar resultado
                    procesarResultadoTrading(profit);
                    
                    // Agregar al historial
                    addOperationToHistory({
                        id: contract_id,
                        timestamp: new Date().toLocaleTimeString(),
                        type: profit > 0 ? 'CALL' : 'PUT',
                        stake: currentContract ? currentContract.stake : tradingStake,
                        profit: profit,
                        result: profit > 0 ? 'WIN' : 'LOSS',
                        status: status
                    });
                    
                    // Mostrar resultado
                    mostrarResultadoOperacion(profit, status, contract_id);
                    
                    // Desuscribirse del stream del contrato.
                    // { proposal_open_contract: 0 } no es válido: hay que
                    // usar forget con el id de suscripción recibido.
                    if (pocSubscriptionId) {
                        derivWs.send(JSON.stringify({ forget: pocSubscriptionId }));
                        pocSubscriptionId = null;
                    } else {
                        derivWs.send(JSON.stringify({ forget_all: "proposal_open_contract" }));
                    }
                    
                    // IMPORTANTE: Limpiar el contrato actual
                    currentContract = null;
                }
            }

            if (data.balance) {
                balance = parseFloat(data.balance.balance);
                updateTradingDisplay();
                console.log(`💰 Balance actualizado: $${balance.toFixed(2)}`);
            }

            if (data.error) {
                console.error("❌ ERROR DERIV:", data.error);
                
                // Manejar diferentes tipos de errores
                // Si falló durante el flujo proposal→buy, liberar el estado
                if (pendingProposal) pendingProposal = null;

                const erroresCompra = [
                    "ContractBuyValidation", "InvalidContract", "RateLimit",
                    "ContractCreationFailure", "InvalidContractProposal",
                    "PriceMoved", "OfferingsValidationError", "AuthorizationRequired"
                ];

                if (erroresCompra.indexOf(data.error.code) !== -1) {
                    
                    console.error("❌ ERROR EN COMPRA:", data.error.message);
                    
                    // Restaurar el balance si había un contrato pendiente
                    if (currentContract) {
                        balance += currentContract.stake;
                        console.log(`💰 Balance restaurado: $${balance.toFixed(2)}`);
                    }
                    
                    // Resetear estado de trading
                    resetTradingState();
                    
                    // Mostrar notificación de error
                    showNotification(
                        'Error en Operación',
                        data.error.message || 'Error desconocido',
                        'error'
                    );
                    
                    updateTradingDisplay();
                }
            }
        };

        derivWs.onerror = (err) => {
            console.error("⚠️ Error WebSocket Deriv:", err);
        };

        derivWs.onclose = () => {
            console.log("🔌 Deriv API desconectada - Reconectando en 5s...");
            
            // Resetear estado si estaba operando
            if (isTrading) {
                console.warn("⚠️ Conexión perdida durante operación activa");
                resetTradingState();
            }
            
            currentContract = null;
            setTimeout(conectarDerivAPI, 5000);
        };
    }

    function mostrarResultadoOperacion(profit, status, contract_id) {
        const resultContent = document.getElementById('result-content');
        if (!resultContent) return;
        
        const resultadoHTML = `
            <div class="result-section" style="border: 2px solid ${profit > 0 ? '#27ae60' : '#e74c3c'}; border-radius: 8px; padding: 15px; margin-top: 8px; background: rgba(255, 255, 255, 0.04);">
                <div class="result-section-title" style="color: ${profit > 0 ? '#27ae60' : '#e74c3c'}; font-size: 1.1rem; margin-bottom: 10px;">
                    <i class="fas fa-${profit > 0 ? 'trophy' : 'times-circle'}"></i> 
                    ${profit > 0 ? 'OPERACIÓN GANADORA ✅' : 'OPERACIÓN PERDEDORA ❌'}
                </div>
                <div class="info-line" style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem;">
                    <span style="color: #95a5a6;">Contract ID:</span>
                    <span style="color: white; font-family: monospace;">${contract_id}</span>
                </div>
                <div class="info-line" style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem;">
                    <span style="color: #95a5a6;">Estado:</span>
                    <span style="color: white;">${status}</span>
                </div>
                <div class="info-line" style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem;">
                    <span style="color: #95a5a6;">Resultado:</span>
                    <strong style="color: ${profit > 0 ? '#27ae60' : '#e74c3c'}; font-size: 1.2rem;">
                        $${profit > 0 ? '+' : ''}${profit.toFixed(2)}
                    </strong>
                </div>
                <div class="info-line" style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem;">
                    <span style="color: #95a5a6;">Hora:</span>
                    <span style="color: white;">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="info-line" style="display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem;">
                    <span style="color: #95a5a6;">Nuevo Balance:</span>
                    <strong style="color: #3498db; font-size: 1.1rem;">
                        $${balance.toFixed(2)}
                    </strong>
                </div>
            </div>
        `;
        
        const existingContent = resultContent.innerHTML;
        const newContent = resultadoHTML + existingContent;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = newContent;
        
        const sections = tempDiv.querySelectorAll('.result-section');
        if (sections.length > 5) {
            for (let i = 5; i < sections.length; i++) {
                sections[i].remove();
            }
        }
        
        resultContent.innerHTML = tempDiv.innerHTML;
        document.getElementById('result-panel').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        
        console.log(`📈 Resultado mostrado: ${profit > 0 ? 'WIN' : 'LOSS'} $${profit.toFixed(2)}`);
    }

    // ====================== HISTORIAL DE OPERACIONES ======================
    function addOperationToHistory(operationData) {
        operationsHistory.unshift(operationData);
        
        if (operationsHistory.length > MAX_HISTORY) {
            operationsHistory.pop();
        }
        
        try {
            localStorage.setItem('operationsHistory', JSON.stringify(operationsHistory));
        } catch (e) {
            console.log('No se pudo guardar en localStorage:', e);
        }
    }

    function loadOperationsHistory() {
        try {
            const saved = localStorage.getItem('operationsHistory');
            if (saved) {
                operationsHistory = JSON.parse(saved);
                console.log(`📚 Historial cargado: ${operationsHistory.length} operaciones`);
            }
        } catch (e) {
            console.log('No se pudo cargar el historial:', e);
        }
    }
    
    // Event listener para actualizar stake cuando cambia el input
    const tradingStakeInput = document.getElementById('trading-stake');
    if (tradingStakeInput) {
        tradingStakeInput.addEventListener('input', function() {
            tradingStake = parseFloat(this.value) || 1;
            updateStakeDisplay();
        });
    }
    </script>
</body>
